name: Contracts CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint OpenAPI spec
        run: npm run validate

      - name: Generate typed client
        run: npm run generate-client

      - name: Upload generated client artifact
        uses: actions/upload-artifact@v4
        with:
          name: rihla-api-client
          path: generated/client
          retention-days: 14

      - name: Build API reference docs
        run: npx @redocly/cli build-docs openapi.yaml -o docs/api-reference.html

      - name: Upload API reference docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: rihla-api-reference
          path: docs/api-reference.html
          retention-days: 14

  breaking-change-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diff against base branch
        run: |
          git fetch origin ${{ github.base_ref }}
          npx @redocly/cli diff origin/${{ github.base_ref }}:openapi.yaml openapi.yaml || true
